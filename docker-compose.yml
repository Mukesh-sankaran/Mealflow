services:
  db:
    image: postgres:16-alpine
    container_name: mealflow-db
    environment:
      POSTGRES_DB: mealflow_db
      POSTGRES_USER: mealflow
      POSTGRES_PASSWORD: mealflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - mealflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealflow -d mealflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mealflow-api
    environment:
      DATABASE_URL: postgresql+pg8000://mealflow:mealflow_dev_password@db:5432/mealflow_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      gunicorn app.main:app -k uvicorn_worker.UvicornWorker --workers 2 --bind 0.0.0.0:8000"


  nginx:
    image: nginx:alpine
    container_name: mealflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mealflow_data:
