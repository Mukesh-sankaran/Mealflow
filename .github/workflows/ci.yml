name: MealFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mealflow
          POSTGRES_PASSWORD: mealflow_test_password
          POSTGRES_DB: mealflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealflow -d mealflow_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        env:
          DATABASE_URL: postgresql+pg8000://mealflow:mealflow_test_password@localhost:5432/mealflow_test_db
          SECRET_KEY: test-secret-key-for-ci-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: python -m pytest -v
